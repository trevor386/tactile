# E-10 layout generalization: snake_3d.yaml with 12 links instead of 16 (same links, joints and skin per link: 288 taxels,
# 11 joints). A shorter, lighter robot, so the body dynamics differ too. Test data only.
robot:
  type: snake
  params:
    num_links: 12
    link_length: 0.10
    radius: 0.025
    link_mass: 0.25
    joint_axes: [z, y]
    joint_effort: 6.0
sensors:
  tactile:
    placements:
      - {generator: cylinder, bodies: "link_\\d+", n_rings: 3, n_per_ring: 8, skin: 0.002}
  joint:
    placements:
      - {generator: joints}
  imu:
    placements:
      - {generator: point, body: link_0, pos: [0.05, 0.0, 0.0], name: imu}
