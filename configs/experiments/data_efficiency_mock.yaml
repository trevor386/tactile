# Phase 1 criterion study on mock data (pipeline test): accuracy vs. amount of training data for the structured
# model and the unstructured baselines.
#   python scripts/data_efficiency.py --config configs/experiments/data_efficiency_mock.yaml
base: configs/experiments/terrain_mock.yaml
output_dir: runs/data_efficiency
fractions: [0.05, 0.1, 0.25, 0.5, 1.0]
seeds: [0, 1, 2]
match_params: true          # scale baseline widths to the structured model's parameter count
reference_model: somato_v1
models:
  somato_v1: configs/models/somato_v1.yaml
  somato_v1_no_spatial: configs/models/somato_v1_no_spatial.yaml
  flat_gru: configs/models/flat_gru.yaml
  transformer: configs/models/transformer.yaml
