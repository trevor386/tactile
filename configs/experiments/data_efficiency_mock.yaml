# Phase 1 criterion study: accuracy vs. amount of training data for the hierarchical encoder and
# unstructured baselines. python scripts/data_efficiency.py --config configs/experiments/data_efficiency_mock.yaml
base: configs/experiments/terrain_mock.yaml
output_dir: runs/data_efficiency
fractions: [0.05, 0.1, 0.25, 0.5, 1.0]
seeds: [0, 1, 2]
match_params: true          # scale baseline widths to the hierarchical model's parameter count
reference_model: hierarchical
models:
  hierarchical: configs/models/hierarchical.yaml
  no_interaction: configs/models/no_interaction.yaml
  transformer_no_geometry: configs/models/transformer_no_geometry.yaml
  flat_gru: configs/models/flat_gru.yaml
