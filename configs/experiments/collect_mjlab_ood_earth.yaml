# OOD test set on Earth (E-7): cold arctic ice, dry sand, gravel (configs/terrains/ood_earth_v1.yaml); otherwise
# identical to collect_mjlab_large.yaml.
#   python scripts/mjlab/collect_mjlab.py --config configs/experiments/collect_mjlab_ood_earth.yaml
robot: configs/robots/snake_3d.yaml
terrains: configs/terrains/ood_earth_v1.yaml
out: datasets/mjlab_v1_ood_earth_600
seed: 11
num_envs: 300
rounds: 2
steps_per_episode: 150
warmup_steps: 50
rates:
  physics_hz: 1000
  control_hz: 100
  latent_hz: 50
  sensors: {tactile: 500, joint: 250, imu: 250}
gait:
  kind: sidewinding
  yaw_amplitude: [0.5, 0.9]
  pitch_amplitude: [0.15, 0.3]
  frequency: [0.4, 1.0]
contact:
  mode: hybrid
  texture_filter: 0.0035
mjlab:
  env_spacing: 4.0
  actuator: dc_motor
  stiffness: 20.0
  damping: 0.5
  effort_limit: 6.0
  saturation_effort: 12.0
  velocity_limit: 8.0
  terrain_compliance: true
  friction_solref: [0.02, 1.0]
