# Terrain classification, version 1, protocol v5: the base for studies started from 2026-10-11. Studies before then
# use terrain_v1.yaml (protocol v4, fixed FSR) and stay reproducible with it.
#   python scripts/train.py --config configs/experiments/terrain_v1b.yaml [--set model=configs/models/transformer.yaml]
# Changes from v4 (decisions 2026-10-11, investigation log):
# * training sensor: the randomized FSR (configs/sensors/fsr_v1_random.yaml; F-26, approved by the user). Evaluate
#   robustness on the fixed fsr_v1 with configs/sensors/robustness_fsr_v1.yaml.
# * step budget max(6000 steps, 15 epochs): twice v4's floor, which doubles the cheap small-data runs where v4
#   under-trained (2-5 points at 25 %, F-28), and leaves the full-data runs (most of the compute; <= 2 points) as they
#   were. About +25 % time for a 10 % / 100 % study, +45 % for a four-point learning curve.
name: terrain_v1b
dataset: datasets/mjlab_v1_2400
output_dir: runs/v1
sensors: configs/sensors/fsr_v1_random.yaml
model: configs/models/somato_v1_pool.yaml
tasks:
  terrain: {type: classification, label: terrain}
window: 25          # 0.5 s windows at 50 Hz (a multiple of the brain stride 5)
stride: 10
eval_stride: 25
split: [0.7, 0.15, 0.15]
train:
  epochs: 15
  min_steps: 6000
  eval_every: 250
  patience: 0
  batch_size: 32
  lr: 0.001
  amp: bf16
  num_workers: 4
  output_steps: 4
  select_metric: terrain/acc_last
augment:
  random_yaw: true
  random_translation: 1.0
  sensor_dropout: 0.05
