# Texture-reliance test: collect_mjlab.yaml without terrain micro-texture (same seed -> episodes paired with
# datasets/mjlab_terrain_600_dc apart from the texture).
# mjlab (MuJoCo-Warp) data collection, same robot, gait, rates and terrains as collect_isaac.yaml so the two
# simulators' datasets are directly comparable:
#   python scripts/mjlab/collect_mjlab.py --config configs/experiments/collect_mjlab.yaml
robot: configs/robots/snake_3d.yaml
terrains: configs/terrains/ice_forms_no_texture.yaml
out: datasets/mjlab_terrain_600_notex
seed: 0
num_envs: 100
rounds: 6                 # episodes = rounds * num_envs
steps_per_episode: 150    # latent steps (3 s at 50 Hz)
warmup_steps: 50          # let the snake settle and the gait ramp up
rates:
  physics_hz: 1000
  control_hz: 100
  latent_hz: 50
  sensors: {tactile: 500, joint: 250, imu: 250}
gait:
  kind: sidewinding       # geom friction is isotropic in MuJoCo too
  yaw_amplitude: [0.5, 0.9]
  pitch_amplitude: [0.15, 0.3]
  frequency: [0.4, 1.0]
contact:
  mode: hybrid
mjlab:
  env_spacing: 4.0
  actuator: dc_motor      # same torque-speed curve as collect_isaac.yaml
  stiffness: 20.0
  damping: 0.5
  effort_limit: 6.0       # continuous torque [Nm]
  saturation_effort: 12.0 # stall torque [Nm]
  velocity_limit: 8.0     # no-load speed [rad/s]
  contact_solref: [0.02, 1.0]   # robot geom soft-contact time constant [s] and damping ratio
