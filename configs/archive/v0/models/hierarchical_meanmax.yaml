# Hierarchical encoder with a mean+max pooling head instead of cluster attention (stage 3 variant). The
# cluster-attention head starts on a ~150-200 step loss plateau; this head trains from the first steps.
architecture: hierarchical
fusion: mixed  # v0: one stage-2 graph over all sensor groups
dim: 64
temporal:
  type: conv_gru
  latent_dim: 64
  params:
    hidden: 64
    conv_channels: 32
spatial:
  type: continuous_conv
  num_layers: 2
  edge_features: rel_pos_local
  length_scale: 0.05
  graph:
    k: 16
    k_per_group:
      tactile: 12
      joint: 3
      imu: 1
    dynamic: true
  params:
    num_basis: 16
    kernel_hidden: 64
    aggregation: mean
heads:
  terrain:
    type: global
    pool: meanmax
    hidden: 128
cluster_mode: body
