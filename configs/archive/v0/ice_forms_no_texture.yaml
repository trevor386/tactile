# Same as ice_forms.yaml but with no surface micro-texture (texture_amp = 0 for every class), to measure how much
# models rely on the texture vibration cue, which a real 2 mm skin with 1 cm taxels would mostly filter out
# (docs/references/sensor_terrain_calibration.md). Friction and sinkage still separate the classes.
texture_modes: 8
classes:
  glare_ice:
    friction:
    - 0.04
    - 0.1
    anisotropy:
    - 1.0
    - 1.3
    restitution:
    - 0.1
    - 0.3
    sinkage:
    - 0.0
    - 0.0
    texture_amp:
    - 0.0
    - 0.0
    texture_wavelength:
    - 0.002
    - 0.004
    undulation_amp:
    - 0.0
    - 0.05
    undulation_wavelength:
    - 0.2
    - 0.5
  rough_ice:
    friction:
    - 0.1
    - 0.22
    anisotropy:
    - 1.2
    - 1.7
    restitution:
    - 0.1
    - 0.3
    sinkage:
    - 0.0
    - 0.0002
    texture_amp:
    - 0.0
    - 0.0
    texture_wavelength:
    - 0.002
    - 0.006
    undulation_amp:
    - 0.05
    - 0.15
    undulation_wavelength:
    - 0.1
    - 0.3
  packed_snow:
    friction:
    - 0.2
    - 0.38
    anisotropy:
    - 1.5
    - 2.5
    restitution:
    - 0.0
    - 0.1
    sinkage:
    - 0.0005
    - 0.0015
    texture_amp:
    - 0.0
    - 0.0
    texture_wavelength:
    - 0.003
    - 0.01
    undulation_amp:
    - 0.1
    - 0.25
    undulation_wavelength:
    - 0.1
    - 0.3
  fresh_snow:
    friction:
    - 0.15
    - 0.3
    anisotropy:
    - 2.0
    - 3.5
    restitution:
    - 0.0
    - 0.05
    sinkage:
    - 0.003
    - 0.008
    texture_amp:
    - 0.0
    - 0.0
    texture_wavelength:
    - 0.005
    - 0.015
    undulation_amp:
    - 0.15
    - 0.35
    undulation_wavelength:
    - 0.08
    - 0.25
  concrete:
    friction:
    - 0.5
    - 0.8
    anisotropy:
    - 1.2
    - 1.8
    restitution:
    - 0.1
    - 0.2
    sinkage:
    - 0.0
    - 0.0
    texture_amp:
    - 0.0
    - 0.0
    texture_wavelength:
    - 0.0005
    - 0.002
    undulation_amp:
    - 0.0
    - 0.08
    undulation_wavelength:
    - 0.2
    - 0.5
