# Terrain catalog v1 (2026-10-08): classes differ in physically enacted properties, not in a synthetic taxel cue.
# Ranges follow docs/references/terrain_physics_v2.md, section 6 (and sensor_terrain_calibration.md, section 4).
#
# * Compliance (mjlab `terrain_compliance`, explicit contact pairs, stiff friction rows): the robot physically sinks
#   into soft ground. On hard ground (ice at any temperature, concrete) the 2 mm skin sets the stiffness, so these
#   classes share one compliance box (rest sinkage < 0.05 mm) and are bouncy (literature damping ratio 0.07-0.3; 0.2-0.4
#   here, which keeps one-step contact flicker at 3-5 % instead of 5-10 %). Snow yields plastically (damping ratio
#   >= 0.7-1). MuJoCo parameters calibrated with scripts/mjlab/calibrate_compliance.py (16-link snake, ~2.5 N/link),
#   resting sinkage: hard 0-0.05 mm; frost 0-0.4 mm; packed snow 0.05-1.3 mm (literature 0.01-1.5);
#   fresh snow ~1.5-21 mm (literature 1.5-25). Sinkage while moving is 50-90 % of the resting value.
# * Friction: one Coulomb coefficient (MuJoCo), ranges across temperature: ice is slippery only near 0 C (0.05-0.2)
#   and grippy in the cold (tread rubber 0.2-1.0 at -10 to -20 C); silicone is unmeasured. Friction alone therefore
#   does not separate the classes.
# * Felt roughness: a pressure-modulating random field sampled through the skin filter (collect with
#   contact.texture_filter = 0.0035 m). Only relief at >= 15 mm wavelengths reaches a 1 cm taxel through a 2 mm skin:
#   rough ice 1-7 mm RMS at 30-150 mm, snow surfaces at 40-200 mm; frost, grains and concrete texture are invisible.
# * No virtual sinkage: `sinkage` is 0 for every class. Not enacted in MuJoCo: restitution (Isaac only; MuJoCo's
#   damping ratio plays its role), anisotropy, undulation (the ground is a plane).
# Known gaps: snow is viscoelastic here, not plastic; no ploughing/berm drag; no stick-slip or static friction; no
# temperature-dependent sensor effects.
texture_modes: 8
classes:
  glare_ice:          # clear, smooth ice, near-melting to cold
    friction: [0.05, 1.0]
    contact_timeconst: [0.015, 0.02]
    contact_dampratio: [0.2, 0.4]
    contact_dmin: [0.9, 0.95]
    contact_width: [0.0005, 0.001]
    texture_amp: [0.0, 0.1]
    texture_wavelength: [0.05, 0.15]
    restitution: [0.4, 0.8]
  rough_ice:          # refrozen / weathered / frosted ice: cm-scale relief, a crushable frost layer
    friction: [0.1, 0.8]
    contact_timeconst: [0.015, 0.02]
    contact_dampratio: [0.2, 0.4]
    contact_dmin: [0.45, 0.95]
    contact_width: [0.0005, 0.002]
    texture_amp: [0.4, 0.9]
    texture_wavelength: [0.03, 0.15]
    restitution: [0.3, 0.7]
  packed_snow:        # 300-500 kg/m^3
    friction: [0.2, 0.6]
    contact_timeconst: [0.02, 0.02]
    contact_dampratio: [0.7, 1.5]
    contact_dmin: [0.4, 0.9]
    contact_width: [0.001, 0.008]
    texture_amp: [0.2, 0.6]
    texture_wavelength: [0.04, 0.2]
    restitution: [0.0, 0.05]
  fresh_snow:         # 50-200 kg/m^3
    friction: [0.15, 0.4]
    contact_timeconst: [0.02, 0.06]
    contact_dampratio: [1.0, 2.0]
    contact_dmin: [0.02, 0.3]
    contact_width: [0.008, 0.05]
    texture_amp: [0.1, 0.4]
    texture_wavelength: [0.04, 0.2]
    restitution: [0.0, 0.0]
  concrete:           # dry; non-ice control surface (texture < 15 mm, invisible through the skin)
    friction: [0.6, 1.0]
    contact_timeconst: [0.015, 0.02]
    contact_dampratio: [0.2, 0.4]
    contact_dmin: [0.9, 0.95]
    contact_width: [0.0005, 0.001]
    texture_amp: [0.1, 0.3]
    texture_wavelength: [0.002, 0.006]
    restitution: [0.4, 0.8]
