# Ice / snow surface classes for the ice-form discrimination task (sim analog).
# Values are parameter ranges sampled per environment on reset. They are rough, literature-informed
# placeholders: calibrate friction and texture against benchtop measurements before drawing
# conclusions. See somato/sim/terrain.py for which simulator enacts which parameter.
texture_modes: 8
classes:
  glare_ice:          # clear, smooth ice
    friction: [0.04, 0.10]
    anisotropy: [1.0, 1.3]
    restitution: [0.1, 0.3]
    sinkage: [0.0, 0.0]
    texture_amp: [0.01, 0.04]
    texture_wavelength: [0.002, 0.004]
    undulation_amp: [0.0, 0.05]
    undulation_wavelength: [0.2, 0.5]
  rough_ice:          # refrozen / frosted ice
    friction: [0.10, 0.22]
    anisotropy: [1.2, 1.7]
    restitution: [0.1, 0.3]
    sinkage: [0.0, 0.0002]
    texture_amp: [0.10, 0.25]
    texture_wavelength: [0.002, 0.006]
    undulation_amp: [0.05, 0.15]
    undulation_wavelength: [0.1, 0.3]
  packed_snow:
    friction: [0.20, 0.38]
    anisotropy: [1.5, 2.5]
    restitution: [0.0, 0.1]
    sinkage: [0.0005, 0.0015]
    texture_amp: [0.15, 0.30]
    texture_wavelength: [0.003, 0.010]
    undulation_amp: [0.10, 0.25]
    undulation_wavelength: [0.1, 0.3]
  fresh_snow:
    friction: [0.15, 0.30]
    anisotropy: [2.0, 3.5]
    restitution: [0.0, 0.05]
    sinkage: [0.003, 0.008]
    texture_amp: [0.20, 0.40]
    texture_wavelength: [0.005, 0.015]
    undulation_amp: [0.15, 0.35]
    undulation_wavelength: [0.08, 0.25]
  concrete:           # non-ice control surface
    friction: [0.50, 0.80]
    anisotropy: [1.2, 1.8]
    restitution: [0.1, 0.2]
    sinkage: [0.0, 0.0]
    texture_amp: [0.05, 0.15]
    texture_wavelength: [0.0005, 0.002]
    undulation_amp: [0.0, 0.08]
    undulation_wavelength: [0.2, 0.5]
